name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
      pull-requests: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@jcode.labs/ragmir
    steps:
      - name: Verify main branch
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The landing's Astro needs Node 22.23.4 or later; the runner cache can hold an older 22.x.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.26.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release gate
        run: pnpm validate

      # npm trusted publishing: pnpm exchanges this job's OIDC identity for a short-lived publish
      # token, so no long-lived npm token is stored in GitHub.
      - name: Semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ragmir-release-${{ github.sha }}
          path: release-artifacts/

      # semantic-release tags the released commit; no tag means nothing was published.
      - name: Detect the published version
        id: published
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for the npm registry
        if: steps.published.outputs.version != ''
        env:
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          # The version metadata appears before the tarball is served; the image build needs both.
          for _ in $(seq 1 30); do
            tarball="$(npm view "@jcode.labs/ragmir@${VERSION}" dist.tarball 2>/dev/null || true)"
            if [ -n "$tarball" ] && curl --fail --silent --head --output /dev/null "$tarball"; then
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve @jcode.labs/ragmir@${VERSION} in time" >&2
          exit 1

      # The organization allows only GitHub-owned actions here, so the image is built with the
      # runner's own Docker Buildx and a digest-pinned binfmt image for arm64 emulation.
      - name: Publish the Docker image
        if: steps.published.outputs.version != ''
        env:
          VERSION: ${{ steps.published.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        run: |
          set -euo pipefail
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx create --name ragmir-release --use
          docker buildx build docker \
            --platform linux/amd64,linux/arm64 \
            --build-arg "RAGMIR_VERSION=${VERSION}" \
            --tag "ghcr.io/jcode-works/ragmir:${VERSION}" \
            --tag ghcr.io/jcode-works/ragmir:latest \
            --push
          docker logout ghcr.io

      - name: Install cosign
        if: steps.published.outputs.version != ''
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check --strict
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

      # Write the published version even when a rerun found nothing new to release, so the
      # registry never receives the server.json committed in the repository.
      - name: Publish to the MCP Registry
        if: steps.published.outputs.version != ''
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs")
            const manifest = JSON.parse(fs.readFileSync("server.json", "utf8"))
            manifest.version = process.env.VERSION
            for (const pkg of manifest.packages ?? []) {
              if (pkg.registryType === "npm") pkg.version = process.env.VERSION
            }
            fs.writeFileSync("server.json", `${JSON.stringify(manifest, null, 2)}\n`)
          '
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" \
            "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
