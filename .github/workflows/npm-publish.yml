name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
      pull-requests: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@jcode.labs/ragmir
    steps:
      - name: Verify main branch
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The landing's Astro needs Node 22.23.4 or later; the runner cache can hold an older 22.x.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.26.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release gate
        run: pnpm validate

      # npm trusted publishing: pnpm exchanges this job's OIDC identity for a short-lived publish
      # token, so no long-lived npm token is stored in GitHub.
      - name: Semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ragmir-release-${{ github.sha }}
          path: release-artifacts/
