name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
      pull-requests: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@jcode.labs/ragmir
    steps:
      - name: Verify main branch
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The landing's Astro needs Node 22.23.4 or later; the runner cache can hold an older 22.x.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.26.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release gate
        run: pnpm validate

      # npm trusted publishing: pnpm exchanges this job's OIDC identity for a short-lived publish
      # token, so no long-lived npm token is stored in GitHub.
      - name: Semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ragmir-release-${{ github.sha }}
          path: release-artifacts/

      # semantic-release tags the released commit; no tag means nothing was published.
      - name: Detect the published version
        id: published
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for the npm registry
        if: steps.published.outputs.version != ''
        env:
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if npm view "@jcode.labs/ragmir@${VERSION}" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "npm did not expose @jcode.labs/ragmir@${VERSION} in time" >&2
          exit 1

      - name: Set up QEMU
        if: steps.published.outputs.version != ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.published.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: steps.published.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the Docker image
        if: steps.published.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: RAGMIR_VERSION=${{ steps.published.outputs.version }}
          push: true
          tags: |
            ghcr.io/jcode-works/ragmir:${{ steps.published.outputs.version }}
            ghcr.io/jcode-works/ragmir:latest

      - name: Install cosign
        if: steps.published.outputs.version != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The prepare step already wrote the released version into server.json.
      - name: Publish to the MCP Registry
        if: steps.published.outputs.version != ''
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" \
            "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
