packages:
  - "."
  - "packages/*"

strictDepBuilds: true

audit:
  # No patched release exists for these advisories. Re-check them on every dependency update and
  # remove each entry as soon as a fixed version is available.
  ignore:
    # braces <=3.0.3: deeply nested patterns can exhaust the stack. Only semantic-release tooling and
    # fast-glob reach it, and fast-glob only receives project-owned source patterns from Ragmir
    # configuration, never MCP input or indexed content.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  "adm-zip@<0.6.1": ^0.6.1
  # Mammoth only imports argparse from its unused CLI. Version 2 retains the legacy CLI aliases
  # and removes the vulnerable sprintf-js dependency from the workspace toolchain.
  "mammoth>argparse": 2.0.1
  yaml: ^2.9.1

packageExtensions:
  "@huggingface/transformers@4.3.0":
    dependencies:
      onnxruntime-common: 1.30.0

allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
