# Development workspace for the Ragmir Python packages. It is not published: each package under
# packages/ has its own pyproject.toml and is released to PyPI with the npm release it launches.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ragmir = { workspace = true }
langchain-ragmir = { workspace = true }
llama-index-retrievers-ragmir = { workspace = true }

[dependency-groups]
dev = [
  "ragmir",
  "langchain-ragmir",
  "llama-index-retrievers-ragmir",
  "langchain-tests==1.1.9",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
  "packages/ragmir/src",
  "packages/langchain-ragmir/src",
  "packages/llama-index-retrievers-ragmir/src",
]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "packages/ragmir/src",
  "packages/langchain-ragmir/src",
  "packages/llama-index-retrievers-ragmir/src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = [
  "packages/ragmir/tests",
  "packages/langchain-ragmir/tests",
  "packages/llama-index-retrievers-ragmir/tests",
]
addopts = "--import-mode=importlib"
