[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-ragmir"
version = "0.0.0"
description = "LangChain and LangGraph integration for Ragmir: a retriever and agent tools that return passages cited to lines, pages, slides, or cells from local documents."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jean-Baptiste Thery", email = "jb.thery@jcode.works" }]
keywords = ["ragmir", "langchain", "langgraph", "retriever", "rag", "agentic-rag", "citations", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["ragmir", "langchain-core>=1.0,<2"]

[project.urls]
Homepage = "https://ragmir.com"
Documentation = "https://github.com/jcode-works/jcode-ragmir/blob/main/docs/python.md"
Repository = "https://github.com/jcode-works/jcode-ragmir"
Issues = "https://github.com/jcode-works/jcode-ragmir/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_ragmir"]
