[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragmir"
version = "0.0.0"
description = "Cited local retrieval for Python agents and RAG apps: search a project's code, PDFs, and Office files and get passages cited to lines, pages, slides, or cells."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "JCode Works", email = "contact@jcode.works" }]
keywords = [
  "ragmir",
  "rag",
  "agentic-rag",
  "retrieval",
  "citations",
  "mcp",
  "local-first",
  "knowledge-base",
  "search",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://ragmir.com"
Documentation = "https://github.com/jcode-works/ragmir/blob/main/docs/python.md"
Repository = "https://github.com/jcode-works/ragmir"
Issues = "https://github.com/jcode-works/ragmir/issues"
Changelog = "https://github.com/jcode-works/ragmir/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmir"]
